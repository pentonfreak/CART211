<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Space+Mono&effect=fire|neon|emboss|shadow-multiple">
    <title>Fonts</title>

    <style>
        body {
            font-family: 'Space Mono', monospace;

    <p class="font-effect-neon"> Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p class="font-effect-emboss"> 1 2 3 4 5 6 7 8 9 0</p>
</body>

</html>
