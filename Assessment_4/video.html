<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroVideography</title>
    <style>
        body {
            font-family: Raleway, sans-serif;
            margin: 20px;
        }

        /* Styles the video players */
        video {
            display: block; /* Places the video on its own line */
            width: 100%; /* Makes the video fill the available content width */
            aspect-ratio: 16 / 9; /* Maintains a 16:9 aspect ratio */
            height: auto; /* Adjusts the height automatically based on the width */
            background-color: black; /* Sets a black background for the video player */
        }

        .size-controls {
            margin-bottom: 15px;
        }

        .size-controls button {
            margin: 8px 10px;
            padding: 5px 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <h1>AstroVideography</h1>
    <p>Watch the Video Below</p>

    <!-- Creates a video player with built-in playback controls -->
    <video controls>
        <!--Loads the mp4 video file from the same folder as this HTML file -->
        <source src="12336940-hd_1920_1028_60fps.mp4" type="video/mp4">
        <!-- Displays this message if the browser does not support the video tag -->
        Sorry, your browser cannot display this video.
    </video>
</body>
</html>
