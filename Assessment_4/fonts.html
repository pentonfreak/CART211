<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Space+Mono+4|Sofia|Orbitron">
    <style>
        h1.a {
            font-family: 'Space Mono', monospace;
        }

        h1.b {
            font-family: 'Sofia', cursive;
        }

        h1.c {
            font-family: 'Orbitron', sans-serif;
        }
    </style>

</head>

<body>
    <h1 class="a">Space Mono Font</h1>
    <p style="font-family: 'Space Mono', monospace;"> Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p style="font-family: 'Space Mono', monospace;"> 1 2 3 4 5 6 7 8 9 0</p>

    <h1 class="b">Sofia Font</h1>
    <p style="font-family: 'Sofia', cursive;"> Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p style="font-family: 'Sofia', cursive;"> 1 2 3 4 5 6 7 8 9 0</p>

    <h1 class="c">Orbitron Font</h1>
    <p style="font-family: 'Orbitron', sans-serif;"> Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p style="font-family: 'Orbitron', sans-serif;"> 1 2 3 4 5 6 7 8 9 0</p>
</body>
